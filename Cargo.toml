[workspace]
resolver = "2"
members = [
    "week1/day1_async_foundations",
    "week1/day2_linux_io",
    "week1/day3_ffi",
    "week1/day4_ipc",
    "week1/day5_fdir",
    "week1/week1_project",
    "week2/day6_rustdoc",
    "week2/day7_tctm",
    "week2/day7_tctm/spacepacket",
    "week2/day8_security",
    "week2/day9_verification",
    "week2/week2_project/obc_core",
    "week2/week2_project/tc_receiver",
    "week2/week2_project/obc_router",
    "week2/week2_project/hk_service",
    "week2/week2_project/sensor_daemon",
    "week2/week2_project/ground_sim",
]

[workspace.dependencies]
tokio            = { version = "1",    features = ["full"] }
tokio-util       = { version = "0.7",  features = ["codec"] }
tokio-serial     = "5"
bytes            = "1"
nix              = { version = "0.29", features = ["signal", "ioctl", "fs", "socket", "process"] }
thiserror        = "2"
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"
bincode          = "2"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
proptest         = "1"
arbitrary        = { version = "1",    features = ["derive"] }
hmac             = "0.12"
sha2             = "0.10"
subtle           = "2"
rand             = "0.8"
zbus             = "4"
anyhow           = "1"
tokio-util-codec = { package = "tokio-util", version = "0.7", features = ["codec"] }

[workspace.metadata]
# Committed Cargo.lock ensures reproducible builds — important in safety-critical contexts.
# In aerospace-adjacent work, "it built yesterday" is not enough; bit-for-bit reproduction matters.
